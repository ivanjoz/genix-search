# GenixSearch
# Compact, lossy, ranked search backend optimized for Spanish product names.
# See CONFIGURATION.md for the full reference.

[server]
log_level = "debug"


[channel]
# `<address>:<port>`. `[::1]` binds IPv6 loopback only, so the port is
# unreachable from other hosts.
#
# NOTE: To listen publicly, bind a routable address instead:
#   inet = "0.0.0.0:1491"   # every IPv4 interface
#   inet = "[::]:1491"      # every interface, IPv4 + IPv6
# The protocol is plaintext and has no rate limiting, so a public bind
# needs a strong `auth_password` below, plus a firewall rule (or an
# SSH/WireGuard tunnel) restricting port 1491 to the client hosts.
inet = "[::1]:1491"
tcp_timeout = 300

# NOTE: You can pass this via `GENIXSEARCH_CHANNEL__AUTH_PASSWORD`.
auth_password = "SecretPassword"


[channel.search]
query_limit_default = 10
query_limit_maximum = 100


[store.kv]
path = "./data/store/kv/"

pool.inactive_after = 1800

database.flush_after = 900
database.compress = true
database.parallelism = 2
database.max_files = 100
database.max_compactions = 1
database.max_flushes = 1
database.write_buffer = 16384
database.write_ahead_log = true
